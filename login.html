<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول العملاء | بوابة قيمة المالية</title>
  <meta name="description" content="تسجيل دخول عملاء قيمة لمتابعة التقارير المالية والقوائم ولوحة المؤشرات.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <div class="page-wrapper" style="flex: 1; display: flex; flex-direction: column;">
    
    <header class="site-header">
      <div class="site-header-inner">
        <a href="index.html" class="site-logo hd">
          <svg viewBox="535 82 322 436" width="34" height="46" role="img" aria-label="شعار قيمة">
            <circle cx="657" cy="117" r="28.5" fill="#F4B438"></circle>
            <circle cx="735" cy="117" r="28.5" fill="#F4B438"></circle>
            <path d="M696 481 A156 156 0 1 1 800.4 440.9 L744.8 416.8 A104 104 0 1 0 696 429 Z" fill="#0E8561"></path>
            <path d="M696 455 C735 455 760 458 790 472 C808 481 818 487 826 488" fill="none" stroke="#0E8561" stroke-width="52" stroke-linecap="round"></path>
          </svg>
          <span class="site-logo-text">
            <span class="site-logo-title">قيمة</span>
            <span class="site-logo-subtitle">محاسبة واستشارات مالية عن بُعد</span>
          </span>
        </a>

        <div class="navcta">
          <a href="index.html" class="btn-secondary">العودة للرئيسية</a>
        </div>
      </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px;">
      <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-4xl); padding: 44px; width: 100%; max-width: 480px; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 28px;">
          <h1 class="hd" style="font-size: 26px; font-weight: 800; margin: 0 0 8px;">بوابة العملاء</h1>
          <p style="color: var(--color-text-body); font-size: 15px; margin: 0;">أدخل بيانات حسابك للاطلاع على لوحة المؤشرات المالية لشركتك.</p>
        </div>

        <form onsubmit="handleLoginSubmit(event)" style="display: flex; flex-direction: column; gap: 18px;">
          <div>
            <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 15px;">البريد الإلكتروني للشركة</label>
            <input type="email" class="form-input" placeholder="name@company.com" required>
          </div>
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label style="font-weight: 700; font-size: 15px;">كلمة المرور</label>
              <a href="#" style="font-size: 13px; color: var(--color-primary); font-weight: 600;">نسيت كلمة المرور؟</a>
            </div>
            <input type="password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-submit-hero" style="margin-top: 8px;">دخول آمن</button>
        </form>

        <div id="login-alert" style="display: none; margin-top: 20px; padding: 14px; border-radius: var(--radius-md); background: var(--color-primary-light); color: var(--color-primary-dark); font-weight: 700; text-align: center; font-size: 15px;">
          تم تسجيل الدخول بنجاح! جاري تحويلك...
        </div>

        <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--color-border-light); text-align: center; font-size: 14px; color: var(--color-text-body);">
          لست عميلاً بعد؟ <a href="contact.html" style="color: var(--color-primary); font-weight: 700;">اطلب اشتراك جديد ←</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner" style="padding: 24px 32px; text-align: center; font-size: 13px;">
        © جميع الحقوق محفوظة لمنصة قيمة للاستشارات والمحاسبة المالية.
      </div>
    </footer>
  </div>

  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      alertBox.style.display = 'block';
      setTimeout(() => {
        alertBox.textContent = 'أهلاً بك في بوابة قيمة التجريبية!';
      }, 1000);
    }
  </script>
</body>
</html>
